
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งชำระเงินค่าห้อง</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    h2 {
      color: #1DB446;
      text-align: center;
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      font-size: 16px;
      background: #fff;
    }

    .checkbox-container {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 12px;
      max-height: 150px;
      overflow-y: auto;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .checkbox-item input {
      margin-right: 10px;
      width: 18px;
      height: 18px;
    }

    .checkbox-item label {
      margin: 0;
      font-weight: normal;
      cursor: pointer;
    }

    .total-box {
      background: #e8f8ed;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #0b802e;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #06C755;
      color: white;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background: #05b04c;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #preview {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      display: none;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    #loading {
      text-align: center;
      color: #666;
      font-style: italic;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    .login-message {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      color: #555;
    }

    .student-confirm {
      background: #e8f8ed;
      border: 1px solid #b7e8c5;
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      line-height: 1.7;
    }

    .student-info {
      text-align: center;
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
<div class="card">

  <h2>💸 แจ้งชำระเงินค่าห้อง</h2>

  <div id="loading">
    กำลังเชื่อมต่อ LINE...
  </div>

  <!-- ส่วนผูกบัญชีนักศึกษา -->
  <section id="loginSection" class="hidden">

    <div class="form-group">
      <label for="studentIdInput">กรอกรหัสนักศึกษา</label>
      <input
        type="text"
        id="studentIdInput"
        placeholder="กรอกรหัสนักศึกษาของคุณ"
        inputmode="numeric"
        autocomplete="off"
      >
    </div>

    <button type="button" id="lookupBtn">
      ตรวจสอบรหัสนักศึกษา
    </button>

    <div id="studentConfirm" class="student-confirm hidden"></div>

    <button type="button" id="registerBtn" class="hidden">
      ยืนยันผูกบัญชี LINE
    </button>

    <div id="loginMessage" class="login-message"></div>

  </section>

  <!-- ส่วนชำระเงิน -->
  <section id="paymentSection" class="hidden">

    <div id="loggedInStudent" class="student-info"></div>

    <form id="paymentForm">

      <div class="form-group">
        <label>เลือกรายการที่ต้องการจ่าย (ติ๊กได้มากกว่า 1)</label>
        <div class="checkbox-container" id="itemsContainer"></div>
      </div>

      <div class="total-box">
        ยอดรวมทั้งสิ้น:
        <span id="totalAmount">0</span>
        บาท
      </div>

      <div class="form-group">
        <label>แนบสลิปการโอนเงิน</label>
        <input
          type="file"
          id="slipInput"
          accept="image/*"
          required
        >
        <img id="preview" alt="ตัวอย่างสลิป">
      </div>

      <button type="submit" id="submitBtn">
        ยืนยันการส่งสลิป
      </button>

    </form>
  </section>

</div>

<script src="./app.js?v=3"></script>
</body>
</html>
