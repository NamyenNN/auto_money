<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งชำระเงินค่าห้อง</title>
  <!-- โหลด LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; width: 100%; max-width: 450px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box; }
    h2 { color: #1DB446; text-align: center; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; }
    select, input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; background: #fff; }
    .checkbox-container { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; max-height: 150px; overflow-y: auto; }
    .checkbox-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 15px; }
    .checkbox-item input { margin-right: 10px; width: 18px; height: 18px; }
    .total-box { background: #e8f8ed; padding: 12px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #0b802e; margin-bottom: 16px; }
    button { width: 100%; padding: 14px; background: #06C755; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #05b04c; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #preview { width: 100%; max-height: 250px; object-fit: contain; display: none; margin-top: 10px; border-radius: 8px; border: 1px solid #eee; }
    #loading { text-align: center; color: #666; font-style: italic; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>💸 แจ้งชำระเงินค่าห้อง</h2>
  <div id="loading">กำลังโหลดข้อมูลรายชื่อ...</div>
  
  <form id="paymentForm" style="display: none;">
    <div class="form-group">
      <label>เลือกชื่อของคุณ</label>
      <select id="studentSelect" required>
        <option value="">-- กรุณาเลือกชื่อ --</option>
      </select>
    </div>

    <div class="form-group">
      <label>เลือกรายการที่ต้องการจ่าย (ติ๊กได้มากกว่า 1)</label>
      <div class="checkbox-container" id="itemsContainer">
        <!-- รายการจะถูกดึงมาใส่ตรงนี้อัตโนมัติ -->
      </div>
    </div>

    <div class="total-box">
      ยอดรวมทั้งสิ้น: <span id="totalAmount">0</span> บาท
    </div>

    <div class="form-group">
      <label>แนบสลิปการโอนเงิน</label>
      <input type="file" id="slipInput" accept="image/*" required>
      <img id="preview" alt="ตัวอย่างสลิป">
    </div>

    <button type="submit" id="submitBtn">ยืนยันการส่งสลิป</button>
  </form>
</div>

<script>
  // 👉 ใส่ Google Apps Script Web App URL ของคุณที่นี่
  const GAS_WEB_APP_URL = 'ใส่_WEB_APP_URL_ของ_APPS_SCRIPT';
  // 👉 ใส่ LIFF ID ของคุณที่สร้างไว้ใน LINE Developers (ถ้ายังไม่ทำ ปล่อยว่างไว้ได้ ระบบจะใช้โหมด Guest)
  const LIFF_ID = 'ใส่_LIFF_ID_ของคุณ';

  let lineUserId = 'GUEST';
  let compressedBase64 = '';
  let fetchedItems = [];

  // เริ่มต้นทำงานดึงข้อมูลและ LIFF
  window.addEventListener('DOMContentLoaded', async () => {
    await initLiff();
    await loadAppData();
  });

  async function initLiff() {
    if (!LIFF_ID || LIFF_ID.includes('ใส่_')) return;
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        const profile = await liff.getProfile();
        lineUserId = profile.userId;
      }
    } catch (err) {
      console.error('LIFF Init Error:', err);
    }
  }

  // ดึงรายชื่อและหัวข้อรายการจาก Google Apps Script (doGet)
  async function loadAppData() {
    try {
      const response = await fetch(GAS_WEB_APP_URL);
      const data = await response.json();

      // เติมรายชื่อลงใน Dropdown
      const select = document.getElementById('studentSelect');
      data.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.studentId;
        opt.setAttribute('data-name', m.name);
        opt.textContent = `${m.studentId} - ${m.name}`;
        
        // ถ้า LINE User ID ตรงกัน ให้เลือกชื่อนั้นให้อัตโนมัติทันที
        if (m.lineUserId === lineUserId && lineUserId !== 'GUEST') {
          opt.selected = true;
        }
        select.appendChild(opt);
      });

      // เติมรายการเก็บเงินลงใน Checkbox (แปลงข้อความดึงราคาในวงเล็บ เช่น "ค่าห้อง (200)" ออกมาเป็นตัวเลข)
      fetchedItems = data.items;
      const container = document.getElementById('itemsContainer');
      fetchedItems.forEach(item => {
        // ดึงตัวเลขจากชื่อหัวข้อ เช่น "ค่าห้อง (200)" จะได้ราคา 200
        const priceMatch = item.title.match(/\((.*?)\)/);
        const price = priceMatch ? parseFloat(priceMatch[1]) || 0 : 0;

        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `
          <input type="checkbox" id="${item.id}" value="${price}" data-title="${item.title}" onchange="calculateTotal()">
          <label for="${item.id}" style="margin:0; font-weight:normal; cursor:pointer;">${item.title}</label>
        `;
        container.appendChild(div);
      });

      document.getElementById('loading').style.display = 'none';
      document.getElementById('paymentForm').style.display = 'block';
    } catch (err) {
      document.getElementById('loading').textContent = '⚠️ ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ URL หรือการ Deploy';
      console.error(err);
    }
  }

  // คำนวณยอดเงินรวมอัตโนมัติเมื่อติ๊กเลือกรายการ
  function calculateTotal() {
    let total = 0;
    const checkboxes = document.querySelectorAll('#itemsContainer input[type="checkbox"]:checked');
    checkboxes.forEach(cb => {
      total += parseFloat(cb.value);
    });
    document.getElementById('totalAmount').textContent = total;
  }

  // บีบอัดรูปภาพสลิปฝั่ง Client ก่อนส่ง (ลดขนาดเหลือไม่เกิน 800px)
  document.getElementById('slipInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        let width = img.width;
        let height = img.height;

        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
        
        const preview = document.getElementById('preview');
        preview.src = compressedBase64;
        preview.style.display = 'block';
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ส่งข้อมูลฟอร์มไปยัง Google Apps Script (doPost)
  document.getElementById('paymentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!compressedBase64) return alert('กรุณาแนบรูปสลิปการโอนเงิน');

    const select = document.getElementById('studentSelect');
    const studentId = select.value;
    const name = select.options[select.selectedIndex].getAttribute('data-name');
    
    // รวบรวมรายการที่ติ๊กเลือก
    const selectedItems = [];
    let itemsNamesArr = [];
    const checkboxes = document.querySelectorAll('#itemsContainer input[type="checkbox"]:checked');
    
    if (checkboxes.length === 0) {
      return alert('กรุณาเลือกอย่างน้อย 1 รายการที่ต้องการชำระ');
    }

    checkboxes.forEach(cb => {
      selectedItems.push({
        id: cb.id,
        title: cb.getAttribute('data-title')
      });
      itemsNamesArr.push(cb.getAttribute('data-title'));
    });

    const totalAmount = parseFloat(document.getElementById('totalAmount').textContent);

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'กำลังอัปโหลดข้อมูล...';

    const payload = {
      action: 'submit_payment',
      userId: lineUserId,
      studentId: studentId,
      name: name,
      selectedItems: selectedItems,
      selectedItemsNames: itemsNamesArr.join(', '),
      totalAmount: totalAmount,
      imageBase64: compressedBase64
    };

    try {
      // ใช้ text/plain เพื่อป้องกัน CORS Error ของ Google Apps Script
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert('✅ ส่งสลิปเรียบร้อยแล้ว! กรุณารอแอดมินตรวจสอบ');
        if (liff.isInClient()) {
          liff.closeWindow(); // ถ้าเปิดใน LINE จะปิดหน้าต่างอัตโนมัติ
        } else {
          location.reload();
        }
      } else {
        alert('เกิดข้อผิดพลาด: ' + result.message);
        btn.disabled = false;
        btn.innerText = 'ยืนยันการส่งสลิป';
      }
    } catch (error) {
      alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      console.error(error);
      btn.disabled = false;
      btn.innerText = 'ยืนยันการส่งสลิป';
    }
  });
</script>

</body>
</html>
